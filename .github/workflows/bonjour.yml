name: Bonjour CI
on: push

jobs:
  bonjour:
    runs-on: ubuntu-latest
    steps:
      - name: Dire bonjour
        run: echo "Bonjour depuis un runner GITHUB !"

      - name: Présenter la machine
        run: |
          date
          uname -a
          python3 --version
          nproc
          free -h
          df -h /
          ls -la

      - name: Récupérer le code
        uses: actions/checkout@v2
        
      - name: Vérifier la récupération
        run: |
          ls -la
          echo "Le code a été récupéré avec succès !"
          




